<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kraków Second Hands</title>
  <meta name="description" content="Every second hand, lumpeks, vintage, charity shop and flea market in Kraków on one map, with opening hours and a thrift route planner.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23c2410c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181c27" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Second Hands">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside>
      <header>
        <div class="top">
          <h1 data-i18n-html="title"></h1>
          <div class="lang" role="group" aria-label="Language">
            <button type="button" data-lang="pl">PL</button>
            <button type="button" data-lang="en">EN</button>
          </div>
        </div>
        <div class="searchrow">
          <input id="q" class="search" type="search" aria-label="Search">
          <button id="filtersBtn" class="ghost filters-btn" type="button" aria-expanded="false" aria-controls="filters" data-i18n="filters"></button>
        </div>
        <div id="filters" class="filters">
          <div class="chips scroll" id="chips"></div>
          <div class="chips scroll" id="tagchips"></div>
          <div class="chips" id="toggles"></div>
          <div class="row">
            <label for="sort" data-i18n="sort"></label>
            <select id="sort"></select>
            <label for="minr" data-i18n="min"></label>
            <select id="minr"></select>
          </div>
        </div>
        <div class="row">
          <button id="near" class="ghost" type="button" data-i18n="nearMe"></button>
          <span id="offlinePill" class="offline-pill" data-i18n="offline" hidden></span>
          <span class="msg" id="msg" hidden></span>
          <span class="count" id="count"></span>
        </div>
      </header>
      <ol id="list"></ol>
      <section id="route" class="route" hidden>
        <div class="route-head">
          <button id="routeToggle" class="route-toggle" type="button" aria-expanded="false" aria-controls="stops"><strong id="routeTitle"></strong><span class="chev" aria-hidden="true">▾</span></button>
          <select id="mode" aria-label="Travel mode"></select>
        </div>
        <ol id="stops" class="stops"></ol>
        <div class="route-actions">
          <a id="routeGo" class="btn" target="_blank" rel="noopener" data-i18n="openRoute"></a>
          <button id="routeOpt" class="ghost" type="button" data-i18n="optimize"></button>
          <button id="routeShare" class="ghost" type="button" data-i18n="share"></button>
          <button id="routeClear" class="link" type="button" data-i18n="clear"></button>
        </div>
      </section>
      <footer>
        <div class="tools">
          <button id="installBtn" class="ghost" type="button" hidden></button>
          <button id="saveMapBtn" class="ghost" type="button"></button>
        </div>
        <p class="credits" data-i18n="footer"></p>
      </footer>
    </aside>
    <div id="map"></div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin=""></script>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin=""></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js" integrity="sha384-tXYNKOHx4T02jMP7YYCtBxPIv1B5gaA5mcVPBzqMp6d7VzWzxJgI2aWF/nJLrQdS" crossorigin=""></script>
  <script src="/select.js"></script>
  <script src="/i18n.js"></script>
  <script src="/hours.js"></script>
  <script src="/app.js"></script>
  <script src="/offline.js"></script>
</body>
</html>
